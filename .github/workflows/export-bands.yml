# Builds data/bands/<target>_<D1..D6>[_mask].json on GitHub, so the SPHEREx cutouts are
# downloaded on GitHub's machine and never on a laptop. It never commits: the files come out
# as one zip per target under Artifacts on the run page. Unzip them into data/bands/ and
# commit them yourself.
#
# Start it from the Actions tab: Export all detectors, Run workflow.
name: Export all detectors

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Targets, space separated (empty = all five)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        target: [Barnard, EpsIndB, WISE0855, RWAur, RDra]
    steps:
      - uses: actions/checkout@v4
        if: inputs.targets == '' || contains(format(' {0} ', inputs.targets), format(' {0} ', matrix.target))
      - uses: actions/setup-python@v5
        if: inputs.targets == '' || contains(format(' {0} ', inputs.targets), format(' {0} ', matrix.target))
        with:
          python-version: "3.12"
      - name: Export ${{ matrix.target }}
        if: inputs.targets == '' || contains(format(' {0} ', inputs.targets), format(' {0} ', matrix.target))
        env:
          SPHEREX_DATA: ${{ runner.temp }}/spherex_data
        run: |
          pip install --quiet numpy scipy astropy
          python tool/export_all_bands.py --clean ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always() && (inputs.targets == '' || contains(format(' {0} ', inputs.targets), format(' {0} ', matrix.target)))
        with:
          name: bands-${{ matrix.target }}
          path: data/bands/${{ matrix.target }}_*.json
          if-no-files-found: ignore
